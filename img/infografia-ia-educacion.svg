<svg viewBox="0 0 900 1400" xmlns="http://www.w3.org/2000/svg" width="900" height="1400">
  <defs>
    <style>text { font-family: Georgia, 'Times New Roman', serif; } .mono { font-family: 'Courier New', Courier, monospace; }</style>
    <linearGradient id="fondo-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e0e0d"/><stop offset="100%" stop-color="#161614"/></linearGradient>
    <linearGradient id="barra-roja" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e84b2f"/><stop offset="100%" stop-color="#c03520"/></linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="30" height="30"><circle cx="15" cy="15" r="0.8" fill="#ffffff" opacity="0.04"/></pattern>
  </defs>

  <!-- FONDO -->
  <rect width="900" height="1400" fill="url(#fondo-grad)"/>
  <rect width="900" height="1400" fill="url(#dots)"/>
  <rect x="0" y="0" width="5" height="1400" fill="#e84b2f"/>

  <!-- CABECERA ROJA -->
  <rect x="0" y="0" width="900" height="110" fill="#e84b2f"/>
  <text x="50" y="60" font-size="38" font-weight="bold" fill="#0e0e0d" letter-spacing="-1" font-family="Georgia, serif">BETA.</text>
  <rect x="142" y="36" width="2" height="32" fill="#0e0e0d" opacity="0.25"/>
  <text x="158" y="50" font-size="9" fill="#0e0e0d" opacity="0.65" font-family="Courier New, monospace" letter-spacing="2">INFOGRAFÍA · TECNOLOGÍA Y NOSOTROS</text>
  <text x="158" y="66" font-size="9" fill="#0e0e0d" opacity="0.65" font-family="Courier New, monospace" letter-spacing="1">CIFP ELORRIETA ERREKA MARI · BILBAO · 2025–2026</text>
  <text x="852" y="58" font-size="9" fill="#0e0e0d" opacity="0.55" font-family="Courier New, monospace" text-anchor="end" letter-spacing="1">JUNIO 2026</text>

  <!-- TÍTULO -->
  <text x="50" y="162" font-size="30" font-weight="bold" fill="#f5f2ec" letter-spacing="-0.5" font-family="Georgia, serif">LA IA EN LAS AULAS VASCAS</text>
  <text x="50" y="194" font-size="17" fill="#e84b2f" font-style="italic" font-family="Georgia, serif">Lo que dicen los datos</text>
  <line x1="50" y1="212" x2="850" y2="212" stroke="#252523" stroke-width="1"/>
  <text x="50" y="233" font-size="10" fill="#555552" font-family="Courier New, monospace" letter-spacing="1">ESTUDIO: J.J. CALLEJA PÉREZ · 38 ALUMNOS · 11 DOCENTES · 3 ESPECIALIDADES</text>

  <!-- === BLOQUE 1: USO === -->
  <text x="50" y="278" font-size="8" fill="#e84b2f" font-family="Courier New, monospace" letter-spacing="3">01 · USO DE LA IA</text>
  <line x1="50" y1="286" x2="850" y2="286" stroke="#252523" stroke-width="1"/>

  <!-- Caja 76,3% -->
  <rect x="50" y="300" width="240" height="145" fill="#151513" rx="2"/>
  <rect x="50" y="300" width="5" height="145" fill="#e84b2f"/>
  <text x="280" y="388" font-size="68" font-weight="bold" fill="#e84b2f" text-anchor="end" letter-spacing="-2" font-family="Georgia, serif">76,3</text>
  <text x="284" y="372" font-size="26" fill="#e84b2f" font-weight="bold" font-family="Georgia, serif">%</text>
  <text x="64" y="425" font-size="11" fill="#9e9b94" font-family="Georgia, serif">usa la IA varias veces</text>
  <text x="64" y="441" font-size="11" fill="#9e9b94" font-family="Georgia, serif">por semana o más</text>

  <!-- Caja 26,3% -->
  <rect x="330" y="300" width="240" height="145" fill="#151513" rx="2"/>
  <rect x="330" y="300" width="5" height="145" fill="#e84b2f"/>
  <text x="560" y="388" font-size="68" font-weight="bold" fill="#e84b2f" text-anchor="end" letter-spacing="-2" font-family="Georgia, serif">26,3</text>
  <text x="564" y="372" font-size="26" fill="#e84b2f" font-weight="bold" font-family="Georgia, serif">%</text>
  <text x="344" y="425" font-size="11" fill="#9e9b94" font-family="Georgia, serif">la usa a diario,</text>
  <text x="344" y="441" font-size="11" fill="#9e9b94" font-family="Georgia, serif">todos los días</text>

  <!-- Caja 100% -->
  <rect x="610" y="300" width="240" height="145" fill="#151513" rx="2"/>
  <rect x="610" y="300" width="5" height="145" fill="#f5f2ec" opacity="0.5"/>
  <text x="840" y="388" font-size="68" font-weight="bold" fill="#f5f2ec" text-anchor="end" letter-spacing="-2" font-family="Georgia, serif">100</text>
  <text x="844" y="372" font-size="26" fill="#f5f2ec" font-weight="bold" font-family="Georgia, serif">%</text>
  <text x="624" y="425" font-size="11" fill="#9e9b94" font-family="Georgia, serif">la emplea en tareas</text>
  <text x="624" y="441" font-size="11" fill="#9e9b94" font-family="Georgia, serif">de sus estudios</text>

  <!-- === BLOQUE 2: PARA QUÉ === -->
  <text x="50" y="492" font-size="8" fill="#e84b2f" font-family="Courier New, monospace" letter-spacing="3">02 · PARA QUÉ LA USAN</text>
  <line x1="50" y1="500" x2="850" y2="500" stroke="#252523" stroke-width="1"/>

  <!-- Barra 92% -->
  <text x="50" y="527" font-size="12" fill="#c8c5bf" font-family="Georgia, serif">Recibir explicaciones teóricas</text>
  <rect x="50" y="534" width="736" height="22" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="534" width="677" height="22" rx="1" fill="url(#barra-roja)"/>
  <text x="800" y="551" font-size="12" font-weight="bold" fill="#e84b2f" font-family="Courier New, monospace">92%</text>

  <!-- Barra 84% -->
  <text x="50" y="580" font-size="12" fill="#c8c5bf" font-family="Georgia, serif">Entender distintos tipos de ejercicios</text>
  <rect x="50" y="587" width="736" height="22" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="587" width="619" height="22" rx="1" fill="url(#barra-roja)" opacity="0.88"/>
  <text x="800" y="604" font-size="12" font-weight="bold" fill="#e84b2f" font-family="Courier New, monospace">84%</text>

  <!-- Barra 66% -->
  <text x="50" y="633" font-size="12" fill="#c8c5bf" font-family="Georgia, serif">Corregir errores y depurar código</text>
  <rect x="50" y="640" width="736" height="22" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="640" width="485" height="22" rx="1" fill="url(#barra-roja)" opacity="0.72"/>
  <text x="800" y="657" font-size="12" font-weight="bold" fill="#e84b2f" font-family="Courier New, monospace">66%</text>

  <!-- Barra 42% -->
  <text x="50" y="686" font-size="12" fill="#c8c5bf" font-family="Georgia, serif">Generar código directamente</text>
  <rect x="50" y="693" width="736" height="22" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="693" width="309" height="22" rx="1" fill="url(#barra-roja)" opacity="0.55"/>
  <text x="800" y="710" font-size="12" font-weight="bold" fill="#e84b2f" font-family="Courier New, monospace">42%</text>

  <!-- === BLOQUE 3: BRECHA === -->
  <text x="50" y="758" font-size="8" fill="#e84b2f" font-family="Courier New, monospace" letter-spacing="3">03 · BRECHA DE PERCEPCIÓN: ALUMNOS VS DOCENTES</text>
  <line x1="50" y1="766" x2="850" y2="766" stroke="#252523" stroke-width="1"/>

  <!-- Leyenda -->
  <rect x="50" y="778" width="12" height="10" fill="#e84b2f" rx="1"/>
  <text x="68" y="788" font-size="9" fill="#6b6965" font-family="Courier New, monospace" letter-spacing="1">ALUMNOS</text>
  <rect x="160" y="778" width="12" height="10" fill="#f5f2ec" opacity="0.5" rx="1"/>
  <text x="178" y="788" font-size="9" fill="#6b6965" font-family="Courier New, monospace" letter-spacing="1">DOCENTES</text>

  <!-- Comparativa 1 -->
  <text x="50" y="816" font-size="11" fill="#555552" font-family="Georgia, serif">La IA ayuda a entender contenidos técnicos</text>
  <rect x="50" y="822" width="736" height="14" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="822" width="615" height="14" rx="1" fill="#e84b2f" opacity="0.85"/>
  <text x="50" y="852" font-size="10" fill="#e84b2f" font-family="Courier New, monospace">Alumnos: 4,18 / 5</text>
  <rect x="50" y="858" width="736" height="14" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="858" width="415" height="14" rx="1" fill="#f5f2ec" opacity="0.35"/>
  <text x="50" y="888" font-size="10" fill="#555552" font-family="Courier New, monospace">Docentes: 2,82 / 5</text>

  <!-- Comparativa 2 -->
  <text x="50" y="914" font-size="11" fill="#555552" font-family="Georgia, serif">Riesgo de aprendizaje superficial</text>
  <rect x="50" y="920" width="736" height="14" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="920" width="496" height="14" rx="1" fill="#e84b2f" opacity="0.55"/>
  <text x="50" y="950" font-size="10" fill="#e84b2f" font-family="Courier New, monospace">Alumnos: 3,37 / 5</text>
  <rect x="50" y="956" width="736" height="14" rx="1" fill="#1c1c1a"/>
  <rect x="50" y="956" width="697" height="14" rx="1" fill="#f5f2ec" opacity="0.7"/>
  <text x="50" y="986" font-size="10" fill="#c8c5bf" font-family="Courier New, monospace">Docentes: 4,73 / 5 — casi unanimidad</text>

  <!-- === BLOQUE 4: DATO INCÓMODO === -->
  <text x="50" y="1030" font-size="8" fill="#e84b2f" font-family="Courier New, monospace" letter-spacing="3">04 · EL DATO INCÓMODO</text>
  <line x1="50" y1="1038" x2="850" y2="1038" stroke="#252523" stroke-width="1"/>

  <!-- Caja 52,6% -->
  <rect x="50" y="1052" width="385" height="130" fill="#151513" rx="2"/>
  <rect x="50" y="1052" width="385" height="4" fill="#e84b2f"/>
  <text x="242" y="1118" font-size="56" font-weight="bold" fill="#e84b2f" text-anchor="middle" letter-spacing="-2" font-family="Georgia, serif">52,6%</text>
  <text x="242" y="1142" font-size="11" fill="#6b6965" text-anchor="middle" font-family="Georgia, serif">admite que la IA reduce</text>
  <text x="242" y="1158" font-size="11" fill="#6b6965" text-anchor="middle" font-family="Georgia, serif">su esfuerzo cognitivo</text>

  <!-- Caja 63,1% -->
  <rect x="465" y="1052" width="385" height="130" fill="#151513" rx="2"/>
  <rect x="465" y="1052" width="385" height="4" fill="#e84b2f"/>
  <text x="657" y="1118" font-size="56" font-weight="bold" fill="#e84b2f" text-anchor="middle" letter-spacing="-2" font-family="Georgia, serif">63,1%</text>
  <text x="657" y="1142" font-size="11" fill="#6b6965" text-anchor="middle" font-family="Georgia, serif">nunca ha recibido orientación</text>
  <text x="657" y="1158" font-size="11" fill="#6b6965" text-anchor="middle" font-family="Georgia, serif">sobre cómo usar la IA</text>

  <!-- === CITA === -->
  <rect x="50" y="1210" width="800" height="88" fill="#e84b2f" rx="2"/>
  <text x="450" y="1248" font-size="15" font-weight="bold" fill="#0e0e0d" text-anchor="middle" font-style="italic" font-family="Georgia, serif">«No es el alumno el que aprende, sino la IA.»</text>
  <text x="450" y="1276" font-size="9" fill="#0e0e0d" text-anchor="middle" font-family="Courier New, monospace" letter-spacing="1" opacity="0.7">— DOCENTE DEL CIFP ELORRIETA ERREKA MARI · BILBAO · 2026</text>

  <!-- PIE -->
  <line x1="50" y1="1330" x2="850" y2="1330" stroke="#252523" stroke-width="1"/>
  <text x="50" y="1352" font-size="8" fill="#3a3835" font-family="Courier New, monospace" letter-spacing="1">FUENTE: CALLEJA PÉREZ, J.J. (2025-2026). TFM · UEU / UPV-EHU · DATOS CEDIDOS POR EL AUTOR</text>
  <text x="850" y="1352" font-size="8" fill="#3a3835" font-family="Courier New, monospace" text-anchor="end" letter-spacing="1">BETA. · PERIODISMO GEN Z</text>
  <rect x="0" y="1385" width="900" height="15" fill="#e84b2f"/>
</svg>
